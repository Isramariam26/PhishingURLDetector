<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Detector</title>
    <style>
        :root {
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --border-color: #e5e7eb;
            --safe-color: #10b981;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 520px;
            padding: 32px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            font-size: 0.95rem;
            color: #6b7280;
            text-align: center;
            margin-bottom: 24px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 0.95rem;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        button[type="submit"] {
            padding: 12px 16px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #ffffff;
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background-color: #fafafa;
            margin-top: 16px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .status-tag {
            font-size: 1.1rem;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Dynamically colors badge based on result string */
        .status-tag.suspicious {
            background-color: #fee2e2;
            color: #991b1b;
        }

        .status-tag.safe {
            background-color: #d1fae5;
            color: #065f46;
        }

        .score {
            font-weight: 600;
            color: #4b5563;
        }

        .reasons-title {
            font-size: 0.9rem;
            font-weight: 600;
            margin: 16px 0 8px 0;
            color: #374151;
        }

        ul.reasons-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        ul.reasons-list li {
            font-size: 0.875rem;
            background: #ffffff;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 3px solid var(--danger-color);
            color: #4b5563;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔐 Phishing URL Detector</h1>
        <p class="subtitle">Enter a URL to check whether it looks suspicious.</p>

        <form method="POST">
            <input 
                type="text" 
                name="url" 
                placeholder="https://example.com" 
                required
            >
            <button type="submit">Check URL</button>
        </form>

        {% if result %}
            <div class="result-box">
                <div class="result-header">
                    <span class="status-tag {% if 'Suspicious' in result %}suspicious{% else %}safe{% endif %}">
                        {{ result }}
                    </span>
                    <span class="score">Score: {{ score }}</span>
                </div>

                {% if reasons %}
                    <p class="reasons-title">Flags Identified:</p>
                    <ul class="reasons-list">
                        {% for reason in reasons %}
                            <li>{{ reason }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}
            </div>
        {% endif %}
    </div>

</body>
</html>
